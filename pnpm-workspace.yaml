packages:
  - apps/*
  - packages/*
  - packages/infra/*
  - e2e

# Install scripts are blocked by default; only allow what is required.
allowBuilds:
  esbuild: true
  cpu-features: false
  ssh2: false
  protobufjs: false
  '@swc/core': false
  '@parcel/watcher': false

minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@5.0.5'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - vitest@5.0.5
  - '@better-auth/core@1.7.10'
  - '@better-auth/drizzle-adapter@1.7.10'
  - '@better-auth/kysely-adapter@1.7.10'
  - '@better-auth/memory-adapter@1.7.10'
  - '@better-auth/mongo-adapter@1.7.10'
  - '@better-auth/prisma-adapter@1.7.10'
  - '@better-auth/telemetry@1.7.10'
  - better-auth@1.7.10
  - mediabunny@1.61.5
  - '@vitest/browser-playwright@5.0.5'
  - '@vitest/browser@5.0.5'
  - '@vitest/pretty-format@5.0.5'
  - '@vitest/ui@5.0.5'
  - '@vitest/utils@5.0.5'
