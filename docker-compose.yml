# Self-hosted Weft. Usage: cp .env.example .env (set BETTER_AUTH_SECRET), then `docker compose up --build`.
name: weft

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: weft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weft}
      POSTGRES_DB: weft
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weft -d weft']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:4.48
    # Writes the S3 identity from env vars, then starts a single-node SeaweedFS with S3.
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        printf '{"identities":[{"name":"weft","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-weft}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - storage-data:/data
    # Browsers upload and stream media straight from storage via presigned URLs.
    ports:
      - '${STORAGE_PORT:-8333}:8333'
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://weft:${POSTGRES_PASSWORD:-weft}@postgres:5432/weft
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (openssl rand -base64 48)}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      S3_ENDPOINT: http://storage:8333
      S3_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_URL:-http://localhost:8333}
      S3_BUCKET: weft
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-weft}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    restart: unless-stopped

  # Renders finished recordings with ffmpeg and transcribes them with whisper.cpp.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://weft:${POSTGRES_PASSWORD:-weft}@postgres:5432/weft
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: weft
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-weft}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-1}
      # Speech recognition model (tiny, base, small or medium); downloaded on first start.
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      # Links in emails point here; set SMTP_URL to send emails (e.g. the mailpit profile below).
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Weft <weft@localhost>}
      TRANSCRIBE_CONCURRENCY: ${TRANSCRIBE_CONCURRENCY:-1}
    volumes:
      # Scratch space for renders (about 3× the size of the recording being rendered).
      - render-scratch:/scratch
      - whisper-models:/models
    depends_on:
      # The API applies database migrations before the worker starts.
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      API_INTERNAL_URL: http://api:4000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional local inbox for trying emails: `docker compose --profile mail up`, then set
  # SMTP_URL=smtp://mailpit:1025 and open http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    profiles: ['mail']
    ports:
      - '${MAILPIT_PORT:-8025}:8025'
    restart: unless-stopped

volumes:
  postgres-data:
  storage-data:
  render-scratch:
  whisper-models:
