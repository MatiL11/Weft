name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm license:check
      # Recorder tests run in a real headless Chromium with fake camera/microphone devices.
      - run: pnpm --filter @weft/recorder exec playwright install --with-deps chromium
      # The render worker's tests run real ffmpeg encodes.
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      # The worker's transcription tests run real whisper.cpp with the tiny model.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/weft-whisper
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/setup-whisper.sh') }}
      - run: scripts/setup-whisper.sh ~/.cache/weft-whisper
      # Integration tests start Postgres through Testcontainers (Docker is available on the runner).
      # One package at a time: video encodes would otherwise starve the recorder's real-time tests.
      - run: pnpm test:coverage --concurrency=1
        env:
          WHISPER_CLI_PATH: /home/runner/.cache/weft-whisper/whisper-cli
          WHISPER_MODEL_PATH: /home/runner/.cache/weft-whisper/ggml-tiny.bin
          WHISPER_SAMPLE_WAV: /home/runner/.cache/weft-whisper/jfk.wav

  e2e:
    name: Docker images, end-to-end tests
    runs-on: ubuntu-latest
    needs: check
    env:
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      S3_SECRET_ACCESS_KEY: ci-only-storage-secret
      # The smallest model keeps the worker's first start quick.
      WHISPER_MODEL: tiny
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Builds the compose services' images, reusing layers from earlier runs.
      - uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,mode=max,scope=api
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,mode=max,scope=web
            worker.cache-from=type=gha,scope=worker
            worker.cache-to=type=gha,mode=max,scope=worker
      - run: docker compose up -d --wait --no-build
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @weft/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          WEFT_URL: http://localhost:3000
      - if: failure()
        run: docker compose logs --no-color > e2e/compose.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/compose.log
          retention-days: 7
